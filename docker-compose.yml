services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: hungry-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-topic-init:
    image: apache/kafka:4.3.0
    container_name: hungry-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPIC_PREFIX: "hungry-capybara"
      PARTITIONS: "1"
      REPLICATION_FACTOR: "1"
      TOPICS: "customer-profile restaurant-catalog customer-session restaurant-browse menu-interaction cart promotion order"
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        set -euo pipefail

        for stream in $$TOPICS; do
          topic="$${TOPIC_PREFIX}.$${stream}"
          echo "Creating topic: $${topic}"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${PARTITIONS}" \
            --replication-factor "$${REPLICATION_FACTOR}"
        done

        echo "Topics:"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list
